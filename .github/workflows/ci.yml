name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: selene src

      # Форматування не блокує CI: один раз виконайте `stylua src` локально,
      # закомітьте результат і приберіть continue-on-error.
      - name: Check formatting
        run: stylua --check src
        continue-on-error: true
